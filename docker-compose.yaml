services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-ozeille}:${DB_PASSWORD:-ozeille}@db:5432/${DB_NAME:-ozeille}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILER_HOST: mailpit
      MAILER_PORT: 1025
      NODE_ENV: development
    ports:
      - ${API_PORT:-3000}:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ozeille}
      POSTGRES_USER: ${DB_USER:-ozeille}
      POSTGRES_DB: ${DB_NAME:-ozeille}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - ${DB_PORT:-5432}:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  redis:
    image: redis:8-alpine
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - ${MAILPIT_WEB_PORT:-8025}:8025
      - ${MAILPIT_SMTP_PORT:-1025}:1025

volumes:
  db-data:
  redis-data: