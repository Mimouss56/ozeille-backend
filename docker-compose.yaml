services:
  users-api:
    build:
      context: ./apps/users-service
      dockerfile: docker/Dockerfile
      target: development
    volumes:
      - ./apps/users-service:/home/node/app
    environment:
      DATABASE_URL: "postgresql://${USERS_DB_USER:-ozeille}:${USERS_DB_PASSWORD:-ozeille}@users-db:5432/${USERS_DB_NAME:-user}?schema=public"

    ports:
      - ${USERS_API_PORT:-3000}:3000
    depends_on:
      users-db:
         condition: service_healthy

  users-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-ozeille}
      POSTGRES_USER: ${USERS_DB_USER:-ozeille}
      POSTGRES_DB: ${USERS_DB_NAME:-user}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  transactions-api:
    build:
      context: ./apps/users-service
      dockerfile: docker/Dockerfile
      target: development
    volumes:
      - ./apps/transactions-service:/home/node/app
    ports:
      - ${TRANSACTIONS_API_PORT:-3001}:3000
    environment:
      "DATABASE_URL": "postgresql://${TRANSACTIONS_DB_USER:-ozeille}:${TRANSACTIONS_DB_PASSWORD:-ozeille}@transactions-db:5432/${TRANSACTIONS_DB_NAME:-ozeille}?schema=public"
    depends_on:
      transactions-db:
        condition: service_healthy

  transactions-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${TRANSACTIONS_DB_PASSWORD:-ozeille}
      POSTGRES_USER: ${TRANSACTIONS_DB_USER:-ozeille}
      POSTGRES_DB: ${TRANSACTIONS_DB_NAME:-ozeille}
    volumes:
      - transaction-db-data:/var/lib/postgresql/data
    ports:
      - "7002:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  redis:
    image: redis:8-alpine

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - ${MAILPIT_WEB_PORT:-8025}:8025
      - ${MAILPIT_SMTP_PORT:-1025}:1025

volumes:
  user-db-data:
  transaction-db-data:
