name: Backend CI
permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"

jobs:
  # On PR: use pr-module-tests.yml for smart module detection
  # On push to develop: full pipeline is handled by develop-pipeline.yml
  call-pr-tests:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-module-tests.yml
    secrets: inherit
