name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/*/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Detect changed modules & run checks per-module
        shell: bash
        run: |
          set -euo pipefail

          # ensure associative array is defined even if empty
          declare -A SERVICE_MODULES=()

          # Compare against develop (PRs target develop)
          git fetch origin develop --no-tags || true

          DIFF=$(git diff --name-only origin/develop...HEAD || true)
          echo "Changed paths:\n$DIFF"

          SERVICES_DIR="apps"
          # associative array already initialized above

          # Find services that have changes and the specific modules under src
          while IFS= read -r path; do
            # match apps/<service>/src/<module>/...
            if [[ $path =~ ^apps/([^/]+)/src/([^/]+)/ ]]; then
              svc=${BASH_REMATCH[1]}
              mod=${BASH_REMATCH[2]}
              SERVICE_MODULES["$svc"]+="$mod "
            else
              # if change anywhere under service, mark service for full run
              if [[ $path =~ ^apps/([^/]+)/ ]]; then
                svc=${BASH_REMATCH[1]}
                SERVICE_MODULES["$svc"]+="__ALL__ "
              fi
            fi
          done <<< "$DIFF"

          # If no service changes found, run checks for all services
          if [ ${#SERVICE_MODULES[@]} -eq 0 ]; then
            echo "No service-specific changes detected — scheduling all services"
            for d in "$SERVICES_DIR"/*; do
              [ -d "$d" ] || continue
              svc=$(basename "$d")
              SERVICE_MODULES["$svc"]+="__ALL__ "
            done
          fi

          echo "Services and modules to run:" 
          for svc in "${!SERVICE_MODULES[@]}"; do
            echo "- $svc : ${SERVICE_MODULES[$svc]}"
          done

          # Start PostgreSQL once if transactions-service needs testing
          POSTGRES_STARTED=0
          if [[ -v SERVICE_MODULES["transactions-service"] ]]; then
            echo "Starting PostgreSQL for transactions-service tests"
            docker run --name postgres_test_ci \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_DB=testdb \
              -p 5432:5432 \
              -d postgres:15-alpine
            
            until docker exec postgres_test_ci pg_isready -U postgres >/dev/null 2>&1; do
              echo "Waiting for Postgres..."
              sleep 1
            done
            POSTGRES_STARTED=1
            echo "PostgreSQL ready"
          fi

          # Run checks per service/module
          for svc in "${!SERVICE_MODULES[@]}"; do
            mods=${SERVICE_MODULES[$svc]}
            svcdir="$SERVICES_DIR/$svc"
            echo "\n--- Running checks for service: $svc (modules: $mods) ---"
              if [ -f "$svcdir/package.json" ]; then
                (cd "$svcdir" && npm ci)
                # Check if this service needs DB
                NEED_DB=0
                if [ "$svc" = "transactions-service" ]; then
                  NEED_DB=1
                fi

                # Setup Prisma if DB is available
                if [ "$NEED_DB" -eq 1 ] && [ "$POSTGRES_STARTED" -eq 1 ]; then
                  export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/testdb"
                  if [ -f "$svcdir/prisma/schema.prisma" ] || [ -d "$svcdir/prisma/migrations" ]; then
                    (cd "$svcdir" && npx prisma generate) || true
                    (cd "$svcdir" && npx prisma migrate deploy --schema=prisma/schema.prisma) || true
                  fi
                fi

                # if __ALL__ present, run full lint/test
                if echo "$mods" | grep -q "__ALL__"; then
                  (cd "$svcdir" && npm run lint --if-present) || true
                  if [ "$NEED_DB" -eq 1 ] && [ "$POSTGRES_STARTED" -eq 1 ]; then
                    (cd "$svcdir" && env DATABASE_URL="$DATABASE_URL" npm test --if-present) || true
                  else
                    (cd "$svcdir" && npm test --if-present) || true
                  fi
                else
                  # Run lint and tests only for changed modules
                  for mod in $mods; do
                    echo "Running lint for module: $mod"
                    (cd "$svcdir" && npx eslint "src/$mod/**" --ext .ts) || true
                    echo "Running tests for module: $mod"
                    if [ "$NEED_DB" -eq 1 ] && [ "$POSTGRES_STARTED" -eq 1 ]; then
                      (cd "$svcdir" && env DATABASE_URL="$DATABASE_URL" npm test -- --testPathPattern="$mod") || true
                    else
                      (cd "$svcdir" && npm test -- --testPathPattern="$mod") || true
                    fi
                  done
                fi
              else
                echo "No package.json for $svc — skipping npm steps"
              fi
          done

          # Cleanup PostgreSQL
          if [ "$POSTGRES_STARTED" -eq 1 ]; then
            echo "Cleaning up PostgreSQL container"
            docker rm -f postgres_test_ci || true
          fi

      - name: Run affected tests
        run: |
          # Placeholder: run tests only for changed packages or modules
          echo "Running affected tests (implement for monorepo)"

      - name: SonarQube Scan
        run: |
          SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}"
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN not set - skipping SonarQube scan"
            exit 0
          fi
          echo "Run Sonar scanner (placeholder)"
