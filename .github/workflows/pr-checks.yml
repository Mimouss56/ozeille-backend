name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Detect changed modules & run checks per-module
        shell: bash
        run: |
          set -euo pipefail

          # ensure associative array is defined even if empty
          declare -A SERVICE_MODULES=()

          # Compare against develop (PRs target develop)
          git fetch origin develop --no-tags || true

          DIFF=$(git diff --name-only origin/develop...HEAD || true)
          echo "Changed paths:\n$DIFF"

          declare -A MODULES

          # Find modules that have changes
          while IFS= read -r path; do
            # match src/<module>/...
            if [[ $path =~ ^src/([^/]+)/ ]]; then
              mod=${BASH_REMATCH[1]}
              # Skip common and generated directories
              if [[ "$mod" != "common" && "$mod" != "generated" ]]; then
                MODULES["$mod"]=1
              fi
            fi
          done <<< "$DIFF"

          # If no module changes found, run checks for all modules
          if [ ${#MODULES[@]} -eq 0 ]; then
            echo "No module-specific changes detected — scheduling all modules"
            for d in src/*/; do
              [ -d "$d" ] || continue
              mod=$(basename "$d")
              if [[ "$mod" != "common" && "$mod" != "generated" ]]; then
                MODULES["$mod"]=1
              fi
            done
          fi

          echo "Modules to run:" 
          for mod in "${!MODULES[@]}"; do
            echo "- $mod"
          done

          # Start PostgreSQL for all tests
          echo "Starting PostgreSQL for tests"
          docker run --name postgres_test_ci \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=testdb \
            -p 5432:5432 \
            -d postgres:17-alpine

          until docker exec postgres_test_ci pg_isready -U postgres >/dev/null 2>&1; do
            echo "Waiting for Postgres..."
            sleep 1
          done
          echo "PostgreSQL ready"

          # Start Redis for all tests
          echo "Starting Redis for tests"
          docker run --name redis_test_ci \
            -p 6379:6379 \
            -d redis:8-alpine
          echo "Redis ready"

          # Install dependencies
          npm ci

          # Generate Prisma Client
          npx prisma generate || true
          npx prisma migrate deploy || true

          # Run checks per module
          for mod in "${!MODULES[@]}"; do
            echo "\n--- Running checks for module: $mod ---"
            
            # Lint
            echo "Running lint for module: $mod"
            npx eslint "src/$mod/**/*.ts" --max-warnings=0 || true
            
            # TI Tests
            if [ -d "test/ti/$mod" ]; then
              echo "Running TI tests for module: $mod"
              env DATABASE_URL="postgresql://postgres:postgres@localhost:5432/testdb" \
                REDIS_HOST=localhost \
                REDIS_PORT=6379 \
                npx jest --testPathPattern="test/ti/$mod/.*\.ti\.spec\.ts" --runInBand || true
            fi
            
            # E2E Tests
            if [ -d "test/e2e/$mod" ]; then
              echo "Running E2E tests for module: $mod"
              env DATABASE_URL="postgresql://postgres:postgres@localhost:5432/testdb" \
                REDIS_HOST=localhost \
                REDIS_PORT=6379 \
                npx jest --config ./jest-e2e.json --testPathPattern="test/e2e/$mod/.*\.e2e\.spec\.ts" --runInBand || true
            fi
          done

          # Cleanup
          echo "Cleaning up containers"
          docker rm -f postgres_test_ci || true
          docker rm -f redis_test_ci || true

      - name: Build application
        run: npm run build || true

      - name: SonarQube Scan
        run: |
          SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}"
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN not set - skipping SonarQube scan"
            exit 0
          fi
          echo "Run Sonar scanner (placeholder)"
