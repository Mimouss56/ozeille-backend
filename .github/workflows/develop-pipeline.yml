name: Develop Pipeline

on:
  push:
    branches: [develop]

permissions:
  contents: write
  packages: write
  id-token: write
  actions: write

jobs:
  full-audit:
    runs-on: ubuntu-latest
    outputs:
      # dto-changed: ${{ steps.check-dto.outputs.dto-changed }}
      tag-pushed: ${{ steps.semantic.outputs.tag-pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/*/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Start PostgreSQL for tests
        run: |
          docker run --name postgres_ci \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=testdb \
            -p 5432:5432 \
            -d postgres:15-alpine
          sleep 5

      - name: Install dependencies (transactions-service)
        run: |
          cd apps/transactions-service
          npm ci

      - name: Install dependencies (users-service)
        run: |
          cd apps/users-service
          npm ci

      - name: Lint (transactions-service)
        run: |
          cd apps/transactions-service
          npm run lint --if-present

      - name: Lint (users-service)
        run: |
          cd apps/users-service
          npm run lint --if-present

      - name: Tests (transactions-service)
        run: |
          cd apps/transactions-service
          npx prisma generate
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npm test -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      - name: Tests (users-service)
        run: |
          cd apps/users-service
          npx prisma generate
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npm test -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      - name: SonarQube Full Scan
        run: |
          SONAR_TOKEN='${{ secrets.SONAR_TOKEN }}'
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN not set - skipping SonarQube full scan"
            exit 0
          fi
          echo "Run Sonar full scan (placeholder)"

      # - name: Check DTO changes
      #   id: check-dto
