      #     fi

      # - name: Build & Publish DTO package
      #   if: steps.check-dto.outputs.dto-changed == 'true'
      #   run: |
      #     echo "DTO changes detected — attempting build & publish"
      #     cd backend || exit 0
      #     # Build DTOs if a build script exists
      #     if npm run | grep -q "build:dtos"; then
      #       npm run build:dtos || true
      #     fi

      #     # Publish to npm if NPM_TOKEN is set
      #     NPM_TOKEN='${{ secrets.NPM_TOKEN }}'
      #     if [ -z "$NPM_TOKEN" ]; then
      #       echo "NPM_TOKEN not set - skipping npm publish of DTO package"
      #     else
      #       echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
      #       # If package folder exists, try to publish (adjust path if needed)
