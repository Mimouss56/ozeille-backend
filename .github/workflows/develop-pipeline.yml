      #         cd packages/shared-dtos
      #         npm publish --access restricted || true
      #       else
      #         echo "No packages/shared-dtos folder found - implement publish steps if needed"
      #       fi
      #     fi

      # - name: Update dependent package.json
      #   if: steps.check-dto.outputs.dto-changed == 'true'
      #   run: |
      #     echo "Updating dependents to latest shared-dtos (manual or script required)"
      #     # If you have a script to update dependent packages, run it here.
      #     # Example placeholder (implement as needed):
      #     # ./scripts/update-dto-dependents.sh
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git config user.name "github-actions[bot]"
      #     git add package.json package-lock.json || true
      #     git commit -m "chore: update shared-dtos dependency [skip ci]" || true
      #     git push origin HEAD:develop || true

      - name: Docker Build & Push
        env:
          DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          echo "Building Docker images"
          # Placeholder: build and push images for services and frontend
          echo "docker build/push steps here (implement using npm scripts or Dockerfiles)"

      - name: Semantic Release
        id: semantic
        run: |
          NPM_TOKEN='${{ secrets.NPM_TOKEN }}'
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN not set - skipping semantic-release"
            echo "tag-pushed=false" >> $GITHUB_OUTPUT
          else
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            if npx semantic-release; then
              echo "tag-pushed=true" >> $GITHUB_OUTPUT
            else
              echo "tag-pushed=false" >> $GITHUB_OUTPUT
            fi
          fi

  merge-to-main:
    needs: full-audit
    runs-on: ubuntu-latest
    if: needs.full-audit.outputs.tag-pushed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward develop -> main
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          git fetch origin develop
          git checkout main
          git merge --ff-only origin/develop || {
            echo "Fast-forward failed (conflict or non-fast-forward)";
            exit 1;
          }
          git push origin main
