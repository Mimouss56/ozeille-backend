name: CI Common

on:
  workflow_call:
    inputs:
      path:
        description: "Working directory for the project (e.g. ./backend or ./frontend)"
        required: true
        type: string
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "24"

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ inputs.node-version }}-package-lock-${{ hashFiles(format('%s/package-lock.json', inputs.path)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node-version }}-
      - name: Install dependencies
        run: npm ci
      - name: Check eslint
        run: npx eslint --version
      - name: Run lint
        run: npm run lint

  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ inputs.node-version }}-package-lock-${{ hashFiles(format('%s/package-lock.json', inputs.path)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node-version }}-
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ inputs.node-version }}-package-lock-${{ hashFiles(format('%s/package-lock.json', inputs.path)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node-version }}-
      - name: Install dependencies
        run: npm ci
      - name: Test placeholder
        run: echo "(ajoute npm test ici quand prêt)"
