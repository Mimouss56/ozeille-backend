name: CI Common - Module-Specific Tests

on:
  workflow_call:
    inputs:
      service:
        description: "Service name (e.g., users-service, transactions-service)"
        required: true
        type: string
      modules:
        description: "Comma-separated list of modules to test (or 'all' for full suite)"
        required: false
        type: string
        default: "all"
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "24"

jobs:
  detect-and-test:
    name: Test ${{ inputs.service }} - ${{ inputs.modules }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            backend/apps/${{ inputs.service }}/node_modules
          key: ${{ runner.os }}-node-${{ inputs.node-version }}-${{ inputs.service }}-${{ hashFiles(format('backend/apps/{0}/package-lock.json', inputs.service)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node-version }}-${{ inputs.service }}-

      - name: Install dependencies
        working-directory: backend/apps/${{ inputs.service }}
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend/apps/${{ inputs.service }}
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
            npx prisma migrate deploy || echo "No migrations to run"
          fi

      - name: Run Lint for modules
        working-directory: backend/apps/${{ inputs.service }}
        run: |
          if [ "${{ inputs.modules }}" = "all" ]; then
            npm run lint
          else
            IFS=',' read -ra MODS <<< "${{ inputs.modules }}"
            for mod in "${MODS[@]}"; do
              echo "Linting module: $mod"
              npx eslint "src/$mod/**/*.ts" --max-warnings=0 || true
            done
          fi

      - name: Run TI Tests
        working-directory: backend/apps/${{ inputs.service }}
        run: |
          if [ "${{ inputs.modules }}" = "all" ]; then
            echo "Running all TI tests"
            npm run test:ti || true
          else
            IFS=',' read -ra MODS <<< "${{ inputs.modules }}"
            for mod in "${MODS[@]}"; do
              echo "Running TI tests for module: $mod"
              MODULE=$mod npm run test:ti:module || true
            done
          fi

      - name: Run E2E Tests
        working-directory: backend/apps/${{ inputs.service }}
        run: |
          if [ "${{ inputs.modules }}" = "all" ]; then
            echo "Running all E2E tests"
            npm run test:e2e || echo "No E2E tests configured"
          else
            IFS=',' read -ra MODS <<< "${{ inputs.modules }}"
            for mod in "${MODS[@]}"; do
              echo "Running E2E tests for module: $mod"
              if [ -d "test/e2e/$mod" ]; then
                MODULE=$mod npm run test:e2e:module || true
              else
                echo "No E2E tests found for module $mod"
              fi
            done
          fi

      - name: Build
        working-directory: backend/apps/${{ inputs.service }}
        run: npm run build

      - name: Build
        working-directory: backend/apps/${{ inputs.service }}
        run: npm run build
