name: CI Common - Module-Specific Tests

on:
  workflow_call:
    inputs:
      service:
        description: "Service name (e.g., users-service, transactions-service)"
        required: true
        type: string
      modules:
        description: "Comma-separated list of modules to test (or 'all' for full suite)"
        required: false
        type: string
        default: "all"
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "24"

jobs:
  detect-and-test:
    name: Test ${{ inputs.service }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            apps/${{ inputs.service }}/node_modules
          key: ${{ runner.os }}-node-${{ inputs.node-version }}-${{ inputs.service }}-${{ hashFiles(format('apps/{0}/package-lock.json', inputs.service)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node-version }}-${{ inputs.service }}-

      - name: Install dependencies
        working-directory: apps/${{ inputs.service }}
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/${{ inputs.service }}
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
            npx prisma migrate deploy || echo "No migrations to run"
          fi

      - name: Run Lint for modules
        working-directory: apps/${{ inputs.service }}
        run: |
          IFS=',' read -ra MODS <<< "${{ inputs.modules }}"
          for mod in "${MODS[@]}"; do
            echo "::group::Linting module: $mod"
            npx eslint "src/$mod/**/*.ts" --max-warnings=0 || true
            echo "::endgroup::"
          done

      - name: Run TI Tests sequentially
        working-directory: apps/${{ inputs.service }}
        run: |
          IFS=',' read -ra MODS <<< "${{ inputs.modules }}"
          for mod in "${MODS[@]}"; do
            if [ -d "test/ti/$mod" ]; then
              echo "::group::Running TI tests for module: $mod"
              npx jest --config ./test/jest-ti-e2e.json --testPathPattern="test/ti/$mod/.*\.ti\\.spec\\.ts" --runInBand
              echo "::endgroup::"
            else
              echo "ℹ️ No TI tests found for module $mod"
            fi
          done

      - name: Run E2E Tests sequentially
        working-directory: apps/${{ inputs.service }}
        run: |
          IFS=',' read -ra MODS <<< "${{ inputs.modules }}"
          for mod in "${MODS[@]}"; do
            if [ -d "test/e2e/$mod" ]; then
              echo "::group::Running E2E tests for module: $mod"
              npx jest --config ./test/jest-e2e.json --testPathPattern="test/e2e/$mod/.*\.e2e\\.spec\\.ts" --runInBand
              echo "::endgroup::"
            else
              echo "ℹ️ No E2E tests found for module $mod"
            fi
          done

      - name: Build
        working-directory: apps/${{ inputs.service }}
        run: npm run build
