name: CI Common - Module-Specific Tests

on:
  workflow_call:
    inputs:
      module:
        description: "Module name to test"
        required: true
        type: string
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"

jobs:
  test-module:
    name: Test ${{ inputs.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MAILER_HOST: localhost
      MAILER_PORT: 1025
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        
      - name: Force Test Environment Variables
        run: |
            # On crée maintenant un .env.test !
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/testdb" > .env.test
            # (On peut aussi créer le .env par précaution pour Prisma CLI si besoin)
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/testdb" > .env

      - name: Generate Prisma Client
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
            npx prisma migrate deploy || echo "No migrations to run"
          fi

      - name: Lint Module
        run: |
          echo "::group::Linting module: ${{ inputs.module }}"
          npx eslint "src/${{ inputs.module }}/**/*.ts" --max-warnings=0 || true
          echo "::endgroup::"

      - name: Run TI Tests for module
        run: |
          if [ -d "test/ti/${{ inputs.module }}" ]; then
             echo "::group::Running TI tests for module: ${{ inputs.module }}"
           npx jest --ci --testPathPatterns="test/ti/${{ inputs.module }}/.*\.ti\.spec\.ts" --runInBand
             echo "::endgroup::"
          else
             echo "ℹ️ No TI tests for ${{ inputs.module }}"
          fi

      - name: Run E2E Tests for module
        run: |
          if [ -d "test/e2e/${{ inputs.module }}" ]; then
            echo "::group::Running E2E tests for module: ${{ inputs.module }}"
            npx jest --ci --testPathPatterns="test/e2e/${{ inputs.module }}/.*\.e2e\.spec\.ts" --runInBand --detectOpenHandles --forceExit
            echo "::endgroup::"
          else
            echo "ℹ️ No E2E tests found for module ${{ inputs.module }}"
          fi
