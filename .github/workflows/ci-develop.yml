name: Develop CI

on:
  push:
    branches: [develop]

jobs:
  full-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: |
          npx prisma generate
          npx prisma migrate deploy
 
      - name: Full Lint & Typecheck
        run: |
          npm run lint

      - name: Run ALL Tests
        run: npm test -- --passWithNoTests --coverage --runInBand
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MAILER_HOST: localhost
          MAILER_PORT: 1025
          NODE_ENV: test
        
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ozeille-backend
            -Dsonar.organization=mimouss56
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/prisma/**
            -Dsonar.test.inclusions=**/*.spec.ts
      # Optionnel : Build Docker "Dev" pour tester l'image
      - name: Build Docker (Check only)
        run: docker build . -f docker/Dockerfile