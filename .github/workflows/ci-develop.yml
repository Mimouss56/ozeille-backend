name: Develop CI

on:
  push:
    branches: [develop]

jobs:
  full-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 1. Le garde-fou pour forcer l'environnement de test local
      - name: Force Test Environment Variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" > .env.test
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" > .env

      - name: Generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Full Lint & Typecheck
        run: npm run lint

      # --- EXÉCUTION SÉQUENTIELLE DES TESTS VIA PACKAGE.JSON ---

      # 2. Exécution des Tests Unitaires (TU)
      # On utilise "npm test" en forçant le dossier src/ pour isoler les TU
      - name: Run Unit Tests (TU)
        run: npm test -- --ci --testPathPatterns="src/.*\.spec\.ts" --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MAILER_HOST: localhost
          MAILER_PORT: 1025
          JWT_SECRET: test-secret-key
          JWT_EXPIRATION: 1d

      # 3. Exécution des Tests d'Intégration (TI)
      # Ton package.json gère déjà --runInBand et --detectOpenHandles pour test:ti
      - name: Run Integration Tests (TI)
        run: npm run test:ti -- --ci --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MAILER_HOST: localhost
          MAILER_PORT: 1025
          JWT_SECRET: test-secret-key
          JWT_EXPIRATION: 1d

      # 4. Exécution des Tests End-to-End (E2E)
      # Ton package.json gère la config, on ajoute juste de quoi fermer les process pour la CI
      - name: Run End-to-End Tests (E2E)
        run: npm run test:e2e -- --ci --runInBand --detectOpenHandles --forceExit --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MAILER_HOST: localhost
          MAILER_PORT: 1025
          JWT_SECRET: test-secret-key
          JWT_EXPIRATION: 1d

      # Optionnel : Build Docker "Dev" pour tester l'image
      - name: Build Docker (Check only)
        run: docker build . -f docker/Dockerfile
