name: PR Backend Checks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "src/**"
      - "test/**"
      - "prisma/**"
      - "package*.json"

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules-matrix: ${{ steps.detect.outputs.modules-matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Fetch develop branch for comparison
          git fetch origin develop --no-tags

          # Get all changed files
          ALL_CHANGED_FILES=$(git diff --name-only origin/develop...HEAD || true)
          echo "All changed files:"
          echo "$ALL_CHANGED_FILES"

          # Get changed files in src/ only
          CHANGED_SRC_FILES=$(echo "$ALL_CHANGED_FILES" | grep "^src/" || true)

          if [ -z "$CHANGED_SRC_FILES" ]; then
            echo "No changes in src/"
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "modules-matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed source files:"
          echo "$CHANGED_SRC_FILES"

          # Build modules list
          declare -A MODULES

          while IFS= read -r file; do
            # Match: src/<module>/...
            if [[ $file =~ ^src/([^/]+)/ ]]; then
              module="${BASH_REMATCH[1]}"
              # Skip common, generated, and non-module files
              if [[ "$module" != "common" && "$module" != "generated" && "$module" != "app.module.ts" && "$module" != "main.ts" ]]; then
                MODULES[$module]=1
              fi
            fi
          done <<< "$CHANGED_SRC_FILES"

          # Build JSON matrix
          MATRIX_ITEMS=()
          for module in "${!MODULES[@]}"; do
            echo "Module: $module"
            MATRIX_ITEMS+=("{\"module\":\"$module\"}")
          done

          if [ ${#MATRIX_ITEMS[@]} -eq 0 ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "modules-matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            MATRIX_JSON="{\"include\":[$(IFS=,; echo "${MATRIX_ITEMS[*]}")]}"
            echo "modules-matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
            echo "Generated matrix: $MATRIX_JSON"
          fi

  # Lancement dynamique des tests
  test-modules:
    name: Test ${{ matrix.module }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.modules-matrix) }}
    uses: ./.github/workflows/ci-common.yml
    with:
      module: ${{ matrix.module }}
      node-version: "22"
  test-cov:
    name: Test Coverage
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run Coverage (npm run test:cov)
        id: coverage
        run: |
          npm run test:cov || echo "::set-output name=failed::true"
      - name: Parse Coverage Summary
        if: steps.coverage.outputs.failed == 'true'
        id: parse_cov
        run: |
          SUMMARY=$(cat coverage/coverage-summary.json | jq -r '.total.lines | "Lignes: "+(.covered|tostring)+"/"+(.total|tostring)+" ("+(.pct|tostring)+"%)"')
          echo "::set-output name=summary::$SUMMARY"
      - name: Comment Coverage on PR (on failure)
        if: steps.coverage.outputs.failed == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ❌ **Échec des tests de couverture**
            Résumé : ${{ steps.parse_cov.outputs.summary }}
            Consultez l'artifact pour le détail complet.
      - name: Upload Coverage Artifact (on failure)
        if: steps.coverage.outputs.failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
