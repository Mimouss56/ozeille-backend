services:

  users-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-ozeille}
      POSTGRES_USER: ${USERS_DB_USER:-ozeille}
      POSTGRES_DB: ${USERS_DB_NAME:-user}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    ports:
      - "7001:5432"

  # transactions-db:
  #   image: postgres:17
  #   environment:
  #     POSTGRES_PASSWORD: ${TRANSACTIONS_DB_PASSWORD:-ozeille}
  #     POSTGRES_USER: ${TRANSACTIONS_DB_USER:-ozeille}
  #     POSTGRES_DB: ${TRANSACTIONS_DB_NAME:-ozeille}
  #   volumes:
  #     - transaction-db-data:/var/lib/postgresql/data
  #   ports:
  #     - "7002:5432"
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
  #     interval: 30s
  #     timeout: 60s
  #     retries: 5
  #     start_period: 80s

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH: ${SMTP_USER:-ozeille}:${SMTP_PASSWORD:-ozeille}
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - ${MAILPIT_WEB_PORT:-8025}:8025
      - ${MAILPIT_SMTP_PORT:-1025}:1025
volumes:
  user-db-data:
  transaction-db-data:
  redis-data:
